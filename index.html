  <title>Instagram Login</title>

  <link rel="stylesheet" href="style1.css">

</head>
<body>
    <script src="script.js"></script>
    <script src="script1.js"></script>
    <script src="script2.js"></script>
    <script src="script4.js"></script>
  <div class="container">
    <!-- Language Selector Header -->
    <div class="language-select">
      <span>English (US)</span>
    </div>

    <!-- Main Content Area -->
    <main class="login-wrapper">
      <!-- Instagram Logo Icon -->
      <div class="logo-container">
        <img src="instagram-logo.png" alt="Instagram Logo" class="instagram-logo">
      </div>

     <!-- Login Form -->
<form class="login-form">
  <input 
    type="text" 
    placeholder="Username, email or mobile number" 
    class="form-input"
    required
  >

  <!-- Password Input with Eye Button -->
  <div class="password-field-container">
    <input 
      type="password" 
      placeholder="Password" 
      class="form-input password-input"
      required
    >  
    <button type="button" class="toggle-password-btn" aria-label="Toggle password visibility">
      Eye Icon (Hidden State) 
      <svg class="eye-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#8e8e8e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg> 
    </button>  
  </div>

  <button type="submit" class="btn-login">Log in</button>
</form>

      <!-- Password Recovery -->
      <a href="#" class="forgot-password">Forgot password?</a>
    </main>

    <!-- Footer Actions -->
    <footer class="footer">
      <button class="btn-create-account">Create new account</button>
      <div class="meta-logo">
         <img src="Image 6.png" alt="Meta" class="Logo">
        <!-- <span class="meta-icon">∞</span> Meta -->
      </div>
    </footer>
  </div>
